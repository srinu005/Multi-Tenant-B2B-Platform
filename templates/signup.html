{% extends 'base.html' %}

{% block content %}
<div class="flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-3xl shadow-xl border border-gray-50">
        <div>
            <div class="mx-auto h-12 w-12 bg-green-100 rounded-full flex items-center justify-center text-green-600">
                <i class="fas fa-building text-xl"></i>
            </div>
            <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">Create Account</h2>
            <p class="mt-2 text-center text-sm text-gray-600">Register your business on the platform</p>
        </div>

        <form class="mt-8 space-y-4" method="POST">
            {% csrf_token %}
            
            <!-- Business Info Section -->
            <div class="bg-gray-50 p-4 rounded-xl border border-gray-100">
                <p class="text-xs font-bold text-gray-400 uppercase mb-3">Business Information</p>
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Company Name</label>
                        <input name="company_name" type="text" required class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" placeholder="e.g. Acme Corp">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Desired Subdomain</label>
                        <div class="flex">
                            <input name="schema_name" type="text" required class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-l-lg focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" placeholder="acme">
                            <span class="inline-flex items-center px-3 rounded-r-lg border border-l-0 border-gray-300 bg-gray-100 text-gray-500 text-sm">.platform.com</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- User Info Section -->
            <div class="space-y-3">
                <p class="text-xs font-bold text-gray-400 uppercase mt-4 mb-1">Admin User Credentials</p>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Username</label>
                    <input name="username" type="text" required class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" placeholder="johndoe">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Email</label>
                    <input name="email" type="email" required class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" placeholder="admin@acme.com">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Password</label>
                    <input name="password" type="password" required class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" placeholder="••••••••">
                </div>
            </div>

            <div class="pt-4">
                <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent text-sm font-bold rounded-xl text-white bg-indigo-600 hover:bg-indigo-700 transition duration-150">
                    Register Business & Admin
                </button>
            </div>
            
            <div class="text-center mt-4">
                <p class="text-sm text-gray-500">Already have an account? <a href="/login/" class="text-indigo-600 font-bold hover:underline">Log In</a></p>
            </div>
        </form>
    </div>
</div>
{% endblock %}
