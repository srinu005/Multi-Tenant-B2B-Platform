<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ tenant.name|default:"B2B PLATFORM"|title }}{% endblock %} | B2B Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .sidebar-link:hover { background-color: rgba(99, 102, 241, 0.1); color: #4f46e5; }
    </style>
</head>
<body class="bg-gray-50 font-sans antialiased">
    
    <!-- Top Navigation -->
    <nav class="fixed top-0 z-50 w-full bg-white border-b border-gray-200">
        <div class="px-3 py-3 lg:px-5 lg:pl-3">
            <div class="flex items-center justify-between">
                <div class="flex items-center justify-start">
                    <span class="self-center text-xl font-bold sm:text-2xl whitespace-nowrap text-indigo-600">
                        <i class="fas fa-layer-group mr-2"></i>{% if tenant %}{{ tenant.name|upper }}{% else %}B2B PLATFORM{% endif %}
                    </span>
                </div>
                <div class="flex items-center gap-4">
                    {% if user.is_authenticated %}
                        <span class="text-sm text-gray-600">Welcome, {{ user.username }}</span>
                        <a href="{% url 'logout' %}" class="text-sm font-medium text-red-600 hover:underline">Logout</a>
                    {% else %}
                        <a href="{% url 'login' %}" class="text-white bg-indigo-600 hover:bg-indigo-700 font-medium rounded-lg text-sm px-5 py-2">Login</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <!-- Sidebar (Only shown if logged in) -->
    {% if user.is_authenticated %}
    <aside class="fixed top-0 left-0 z-40 w-64 h-screen pt-20 transition-transform bg-white border-r border-gray-200 sm:translate-x-0">
        <div class="h-full px-3 pb-4 overflow-y-auto">
            <ul class="space-y-2 font-medium">
                <li>
                    <a href="/dashboard/" class="flex items-center p-2 text-gray-900 rounded-lg sidebar-link">
                        <i class="fas fa-chart-pie w-5 h-5 text-gray-500 transition duration-75"></i>
                        <span class="ml-3">Dashboard</span>
                    </a>
                </li>
                <li>
                    <a href="/products/" class="flex items-center p-2 text-gray-900 rounded-lg sidebar-link">
                        <i class="fas fa-boxes w-5 h-5 text-gray-500"></i>
                        <span class="flex-1 ml-3 whitespace-nowrap">Inventory</span>
                    </a>
                </li>
                <li>
                    <a href="#" class="flex items-center p-2 text-gray-900 rounded-lg sidebar-link">
                        <i class="fas fa-users w-5 h-5 text-gray-500"></i>
                        <span class="flex-1 ml-3 whitespace-nowrap">Customers</span>
                    </a>
                </li>
            </ul>
        </div>
    </aside>
    {% endif %}

    <!-- Main Content Area -->
    <div class="p-4 {% if user.is_authenticated %}sm:ml-64{% endif %} pt-20">
        {% block content %}{% endblock %}
    </div>

</body>
</html>
